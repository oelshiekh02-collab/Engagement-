<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doaa & Khaled</title>
  <style>
    :root {
      --bg1: #fff8f5;
      --bg2: #f9e5dc;
      --ink: #4b2d2b;
      --gold: #d6b77e;
      --rose: #d98a8a;
      --pink: #f7dfe4;
      --shadow: rgba(75, 45, 43, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--ink);
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      position: relative;
    }

    .backdrop {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.9), transparent 35%),
        radial-gradient(circle at bottom, rgba(217,138,138,0.15), transparent 30%);
      pointer-events: none;
    }

    .invitation {
      position: relative;
      width: min(92vw, 780px);
      height: min(88vh, 900px);
      background: rgba(255, 255, 255, 0.28);
      border: 1px solid rgba(214,183,126,0.5);
      box-shadow: 0 30px 80px var(--shadow);
      backdrop-filter: blur(7px);
      border-radius: 24px;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 48px 36px;
      z-index: 1;
    }

    .invitation::before,
    .invitation::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border: 1px solid rgba(214,183,126,0.5);
      border-radius: 50%;
      opacity: 0.9;
    }

    .invitation::before {
      top: -70px;
      left: -60px;
    }

    .invitation::after {
      bottom: -90px;
      right: -60px;
    }

    .content {
      text-align: center;
      z-index: 2;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 1.7s ease forwards 0.6s;
    }

    .eyebrow {
      letter-spacing: 0.4rem;
      text-transform: uppercase;
      color: var(--gold);
      font-size: 0.82rem;
      margin-bottom: 18px;
      animation: glow 2s ease-in-out infinite alternate;
    }

    h1 {
      font-size: clamp(2.8rem, 5vw, 5rem);
      font-weight: 400;
      letter-spacing: 0.09em;
      line-height: 1.1;
      margin: 0;
      color: var(--ink);
      text-shadow: 0 2px 10px rgba(0,0,0,0.08);
    }

    .ampersand {
      font-size: clamp(3rem, 5vw, 5.5rem);
      color: var(--rose);
      margin: 4px 0;
      display: block;
      animation: pulse 2.2s ease-in-out infinite;
    }

    .details {
      margin-top: 26px;
      font-size: clamp(1rem, 1.4vw, 1.3rem);
      line-height: 1.9;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(75,45,43,0.9);
    }

    .date {
      margin-top: 24px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .line {
      width: 110px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 16px auto 20px;
    }

    .venue {
      font-size: 0.9rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(75,45,43,0.75);
      margin-top: 10px;
    }

    .cta {
      margin-top: 28px;
      display: inline-block;
      padding: 14px 28px;
      border: 1px solid rgba(214,183,126,0.9);
      background: rgba(255,255,255,0.36);
      color: var(--ink);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.75rem;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 35px rgba(0,0,0,0.1);
      background: rgba(255,255,255,0.68);
    }

    .petal, .heart {
      position: absolute;
      pointer-events: none;
      opacity: 0.8;
      z-index: 0;
    }

    .petal {
      width: 16px;
      height: 20px;
      background: linear-gradient(135deg, #f5d1d7, #d98a8a);
      border-radius: 60% 0 60% 0;
      box-shadow: 0 0 10px rgba(217,138,138,0.25);
      animation: fall linear infinite;
    }

    .heart {
      width: 18px;
      height: 18px;
      background: rgba(217,138,138,0.8);
      transform: rotate(-45deg);
      animation: floatHeart linear infinite;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      background: inherit;
      border-radius: 50%;
    }

    .heart::before { top: -9px; left: 0; }
    .heart::after { left: 9px; top: 0; }

    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes glow {
      from { filter: drop-shadow(0 0 0 rgba(214,183,126,0)); }
      to { filter: drop-shadow(0 0 12px rgba(214,183,126,0.45)); }
    }

    @keyframes fall {
      0% {
        transform: translateY(-20vh) rotate(0deg);
        opacity: 0;
      }
      12% { opacity: 0.8; }
      100% {
        transform: translateY(110vh) rotate(160deg);
        opacity: 0;
      }
    }

    @keyframes floatHeart {
      0% {
        transform: translateY(0) scale(0.8) rotate(-45deg);
        opacity: 0;
      }
      20% { opacity: 0.8; }
      50% {
        transform: translateY(-18px) scale(1) rotate(-45deg);
      }
      100% {
        transform: translateY(-34px) scale(0.9) rotate(-45deg);
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      .invitation {
        height: 85vh;
        padding: 24px 20px;
      }

      .details {
        letter-spacing: 0.06em;
      }

      .venue {
        letter-spacing: 0.12em;
      }
    }
  </style>
</head>
<body>
  <div class="backdrop"></div>

  <div class="invitation">
    <div class="content">
      <div class="eyebrow">You are invited</div>
      <h1>Doaa <span class="ampersand">&amp;</span> Khaled</h1>

      <div class="line"></div>

      <div class="details">
        Request the pleasure of your company<br />
        at our engagment celebration
      </div>

      <div class="date">Thursday, 8 October 2027</div>
      <div class="venue">At Bride home</div>

      <a class="cta" href="#">Save the Date</a>
    </div>
  </div>

  <script>
    function createPetal() {
      const petal = document.createElement("span");
      petal.className = "petal";
      petal.style.left = Math.random() * 100 + "vw";
      petal.style.animationDuration = (Math.random() * 8 + 7) + "s";
      petal.style.animationDelay = Math.random() * 4 + "s";
      petal.style.transform = "rotate(" + Math.random() * 360 + "deg)";
      document.body.appendChild(petal);
      setTimeout(() => petal.remove(), 15000);
    }

    function createHeart() {
      const heart = document.createElement("span");
      heart.className = "heart";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.bottom = "10px";
      heart.style.animationDuration = (Math.random() * 8 + 8) + "s";
      heart.style.animationDelay = Math.random() * 3 + "s";
      heart.style.opacity = "0.7";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 18000);
    }

    for (let i = 0; i < 26; i++) {
      setTimeout(createPetal, i * 220);
    }

    setInterval(() => {
      if (Math.random() > 0.35) createPetal();
    }, 600);

    setInterval(() => {
      createHeart();
    }, 1400);
  </script>
</body>
</html>
